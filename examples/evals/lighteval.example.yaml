# 示例：LightEval benchmark dry-run recipe。
recipe_id: lighteval.demo-v0.1
backend: lighteval
stage: benchmark

launcher: accelerate

model:
  args: "pretrained=Qwen/Qwen3-0.6B,dtype=bfloat16"

data:
  tasks: "custom|agent_tool_use|0|0"

outputs:
  output_dir: runs/eval_runs/lighteval-demo-v0.1

gate:
  min_pass_rate: 0.8
  allow_failed_cases: false
