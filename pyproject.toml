[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badcaseflow"
version = "0.1.0"
description = "Controlled self-evolution workflow for agent badcases, evals, and post-training."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "BadcaseFlow Contributors"}
]
dependencies = []

[project.scripts]
bcf = "badcaseflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

